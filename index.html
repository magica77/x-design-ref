<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Refs — X inspiration library</title>
<style>
:root{
  --bg:#f6f6f3;--bg2:#ffffff;--fg:#17171a;--muted:#6b6b73;--line:#e4e4df;--chip:#efefea;--accent:#5b5bd6;
  --gold:#c99a2e;--gold-bg:#fbf3df;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --c-info:#0e9f6e;--c-web:#d6409f;--c-prod:#e5781b;--c-app:#3e63dd;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f0f12;--bg2:#18181d;--fg:#ececf1;--muted:#9a9aa6;--line:#2a2a32;--chip:#23232a;--accent:#8b8bf5;
  --gold:#e8b949;--gold-bg:#2b2414;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);}}
:root[data-theme=dark]{--bg:#0f0f12;--bg2:#18181d;--fg:#ececf1;--muted:#9a9aa6;--line:#2a2a32;--chip:#23232a;--accent:#8b8bf5;
  --gold:#e8b949;--gold-bg:#2b2414;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
.top{display:flex;align-items:center;gap:16px;padding:18px 0 12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c-web),var(--accent) 55%,var(--c-info));display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.search{position:relative}
.search input{width:330px;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
select,.btn{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 12px}
.seg{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:11px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;font:inherit;font-weight:550;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--bg2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{font-size:11px;opacity:.65}
.dot{width:8px;height:8px;border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 14px;max-height:84px;overflow:auto}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:3px 9px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip .n{color:var(--muted);margin-left:4px;font-size:11px}
.chip.derived{border-style:dashed}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on .n{color:inherit;opacity:.7}
main{padding:22px 0 60px}
.meta-line{color:var(--muted);font-size:12.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.thumb{position:relative;aspect-ratio:16/10;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .4s ease}
.card:hover .thumb img{transform:scale(1.03)}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:650;padding:3px 8px;border-radius:7px;color:#fff;letter-spacing:.01em}
.mt{position:absolute;bottom:10px;right:10px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff}
.gold-ribbon{position:absolute;top:10px;right:10px;background:var(--gold);color:#1b1405;font-size:11px;font-weight:750;padding:3px 9px;border-radius:7px;box-shadow:0 2px 10px rgba(201,154,46,.45)}
.card.gold{border:1.5px solid var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 16%,transparent)}
.card.gold .body{background:linear-gradient(180deg,var(--gold-bg),var(--bg2) 70%)}
.body{padding:13px 15px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.author{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.author b{font-weight:650;white-space:nowrap}.author span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.author span{color:var(--muted)}
.desc{color:var(--fg);opacity:.86;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctags span{font-size:11px;color:var(--muted);background:var(--chip);padding:1px 7px;border-radius:999px}
.ctags span.derived{background:transparent;border:1px dashed var(--line)}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px;border-top:1px solid var(--line);padding-top:9px}
.stats b{color:var(--fg);font-weight:650}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,8,12,.62);backdrop-filter:blur(4px);display:none;z-index:20;padding:3vh 3vw}
.ov.open{display:flex;align-items:center;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(1180px,100%);max-height:94vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.shot{background:var(--chip);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center}
.shot img{max-width:100%;border-radius:12px;box-shadow:var(--shadow);background:#fff}
.shot .cap{font-size:11px;color:var(--muted)}
.info{padding:24px 26px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.info h2{margin:0;font-size:18px;letter-spacing:-.01em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:650;padding:3px 8px;border-radius:7px;color:#fff}
.goldpill{background:var(--gold);color:#1b1405}
.sect h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sect p{margin:0}
.posttext{white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{background:var(--chip);border-radius:10px;padding:8px 10px}
.m b{display:block;font-size:16px}.m span{font-size:11px;color:var(--muted)}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 11px;margin:0 0 8px;font-size:13px}
.quote cite{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.primary{background:var(--fg);color:var(--bg);border:0;padding:9px 14px;border-radius:10px;text-decoration:none;font-weight:650}
.x{position:absolute;top:14px;right:16px;font-size:20px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);width:36px;height:36px;border-radius:50%;cursor:pointer}
.nav{margin-left:auto;display:flex;gap:6px}
@media (max-width:860px){.modal{grid-template-columns:1fr}.search input{width:180px}.shot{max-height:45vh}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="logo">✦</div>
    <div><h1>Design Refs</h1><div class="sub" id="sub"></div></div>
    <div class="spacer"></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search posts, authors, tags…  ( / )" autocomplete="off"></label>
    <select id="sort" title="Sort">
      <option value="impressions">Most impressions</option>
      <option value="likes">Most likes</option>
      <option value="bookmarks">Most bookmarks</option>
      <option value="date">Newest</option>
      <option value="collected">Recently collected</option>
    </select>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
  </div>
  <div class="bar"><div class="seg" id="cats"></div></div>
  <div class="tags" id="tags"></div>
</div></header>
<main class="wrap">
  <div class="meta-line" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No references match these filters.</div>
</main>
<div class="ov" id="ov"><div class="modal" id="modal" style="position:relative"></div></div>
<script>
const DATA = {"refs": [{"id": "2108249557519970369", "url": "https://x.com/excalidraw/status/2108249557519970369", "author": {"handle": "excalidraw", "name": "Excalidraw"}, "created_at": "2026-10-08T17:33:58.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["cli", "developer-tools", "product-demo"], "description": "Excalidraw's 39-second launch video for the Excalidraw CLI, which renders Excalidraw diagrams from Excalidraw+ or local files so AI agents can see and check their own diagrams. The video pairs a hand-drawn title ('Render any scene to PNG') with a clean terminal session listing and rendering scenes. It's a strong reference for a short, focused developer-tool intro: one capability, shown in the product's own visual language, ending on a one-line call to action ('Install today').", "text": "Excalidraw CLI released!\n\nLog in to your Excalidraw+ account or use with local files.\n\nYou can easily render Excalidraw diagrams to give better output feedback to your agents.\n\nInstall today.", "metrics": {"impressions": 72692, "likes": 1479, "reposts": 97, "replies": 48, "quotes": 24, "bookmarks": 844}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2108248656126111744/img/U-wrCqEquBX2hp3-.jpg", "duration_ms": 38866, "mp4": "https://video.twimg.com/amplify_video/2108248656126111744/vid/avc1/1280x720/QRuIXo38Qfpk6hAi.mp4"}], "replies_summary": "Overwhelmingly positive and practical: most replies latch onto the agent 'render loop' — letting agents render and look at their own diagrams so humans can spot misunderstandings fast — and several users report already adding it to workflows. Recurring questions are about pricing ('Is it free to use?'), CLI vs. MCP, and whether the rendered PNG flows back into the agent's context; a few push long-standing feature requests (subfolders) or name alternatives (tldraw, Mermaid). Quote posts echo the same theme ('My agents will love this') across English, Japanese, Turkish, Portuguese, Chinese and Korean audiences.", "notable_replies": [{"handle": "@Simplyrapp", "text": "A CLI for diagrams is sneaky useful: agents can render what they think the system looks like, and humans can spot the misunderstanding in seconds."}, {"handle": "@arpittalksstuff", "text": "letting agents render and look at their own output is so underrated."}, {"handle": "@rdiazjonguitud", "text": "Tried it. Great work, adding it to my daily workflows."}, {"handle": "@sethpchen", "text": "But what about a simple feature like subfolders? It’s been pending for years 😅"}], "gold_standard": true, "screenshot": "shots/2108249557519970369.png", "screenshot_method": "embed", "thumbnail": "thumbs/2108249557519970369.jpg"}, {"id": "2111515160766550057", "url": "https://x.com/github/status/2111515160766550057", "author": {"handle": "github", "name": "GitHub"}, "created_at": "2026-10-17T17:50:19.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["hardware", "product-film", "copilot"], "description": "GitHub's product film for the Logitech MX Keypad integrated with the GitHub Copilot app, showing physical keys mapped to agent prompts and sessions. A reference for a hardware-meets-software intro that sells a workflow rather than specs.", "text": "Your workflows have changed with AI. How about your setup?\n\nPhysical controls are back. Take the new Logitech MX Keypad, now directly integrated with the GitHub Copilot app.\n\nThis experience allows you to run agentic workflows with control, map a repeated prompt, start or resume a session, and help you stay in flow.\nhttps://t.co/zbcYD8xQKf", "metrics": {"impressions": 86846, "likes": 479, "reposts": 52, "replies": 53, "quotes": 10, "bookmarks": 149}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/media/HU2b2NtWoAAF01q.jpg", "duration_ms": 58766, "mp4": "https://video.twimg.com/amplify_video/2111515086783213568/vid/avc1/640x360/fzK39hbjy3uSlTsf.mp4?tag=16"}], "replies_summary": "The design-relevant replies like the idea of mapping a repeated prompt to a physical key, and several ask for approve, stop or pause buttons for agent runs. One jokes about spending 20 years removing buttons only to buy keypads again; the rest of the thread is account-suspension complaints unrelated to the post.", "notable_replies": [{"handle": "@Vidur2302", "text": "Mapping a repeated prompt to a physical key is a smart touch. So much agent work right now is typing the same \"run the tests and fix what fails\" line again and again."}, {"handle": "@therealhacker97", "text": "we spent 20 years removing buttons from everything and now we're buying keypads to talk to the AI. progress"}], "gold_standard": false, "screenshot": "shots/2111515160766550057.png", "screenshot_method": "embed", "thumbnail": "thumbs/2111515160766550057.jpg"}, {"id": "2111313462987231519", "url": "https://x.com/rauchg/status/2111313462987231519", "author": {"handle": "rauchg", "name": "Guillermo Rauch"}, "created_at": "2026-10-17T04:28:50.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Animated Website", "tags": [], "derived_tags": ["webgl", "3d-web", "interactive"], "description": "Guillermo Rauch rebuilt the Roadster demo as a playable, detailed browser simulation. Reference for an interactive 3D web experience shipped as a single page.", "text": "Rebuilt the Roadster demo in a playable, highly accurate simulation that retains a lot of the IRL details:\nhttps://t.co/6ki8kSJwdP https://t.co/cxd6T88CTc", "metrics": {"impressions": 104091, "likes": 1825, "reposts": 69, "replies": 196, "quotes": 30, "bookmarks": 399}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2111310764036558848/img/gKOdD4jEUhr_Usac.jpg", "duration_ms": 27233, "mp4": "https://video.twimg.com/amplify_video/2111310764036558848/vid/avc1/516x360/5PVrHtGl9dH9v6Fv.mp4"}], "replies_summary": "Playful and impressed ('Incredible', 'crazy good'), with many replies sharing their own browser builds or screen grabs. One notes the flex is a self-contained HTML file with no build step; one asks about mobile load time.", "notable_replies": [{"handle": "@prathamjain33", "text": "One self-contained HTML file is the flex here. No build step, just ships."}, {"handle": "@ossderick", "text": "Is it mobile-friendly ? It took very long to load on my device"}], "gold_standard": false, "screenshot": "shots/2111313462987231519.png", "screenshot_method": "embed", "thumbnail": "thumbs/2111313462987231519.jpg"}, {"id": "2111238288799322159", "url": "https://x.com/simongerman600/status/2111238288799322159", "author": {"handle": "simongerman600", "name": "Simon Kuestenmacher"}, "created_at": "2026-10-16T23:30:07.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Infographic", "tags": [], "derived_tags": ["map", "dataviz", "migration"], "description": "A vintage-styled, Minard-inspired flow map of net moves between US states, with band widths for each corridor, a top-10 corridor table and a Northeast inset. A reference for an editorial flow map that tells one clear story (California and New York out, Florida and Texas in) at a glance.", "text": "Americans are moving south! This fascinating map shows the biggest interstate migration flows between 2021 and 2025. California is losing residents to Texas, Arizona and Nevada, while New Yorkers are heading to Florida and New Jersey. Florida and Texas are the big winners. https://t.co/C84I93nE2Z", "metrics": {"impressions": 61280, "likes": 209, "reposts": 44, "replies": 40, "quotes": 10, "bookmarks": 48}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "image", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUygCP0WQAAuM69.jpg", "preview_image_url": null, "duration_ms": null, "mp4": null}], "replies_summary": "Replies are almost entirely partisan arguments about why people are moving, with little comment on the map itself. One reply jokes that people are moving straight to where it's getting hotter.", "notable_replies": [{"handle": "@xtuffai", "text": "Which is weird because they are moving straight to where it is getting hotter."}], "gold_standard": false, "screenshot": "shots/2111238288799322159.png", "screenshot_method": "embed", "thumbnail": "thumbs/2111238288799322159.jpg"}, {"id": "2111193957527146711", "url": "https://x.com/cursor_ai/status/2111193957527146711", "author": {"handle": "cursor_ai", "name": "Cursor"}, "created_at": "2026-10-16T20:33:58.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "ai-agents", "dashboard-ui"], "description": "Cursor demo of cloud agents building interactive canvases — ask for a dashboard or report while the agent works, then share the canvas as a link. Reference for an in-product feature demo that shows the output artifact rather than the chat.", "text": "Cloud agents can now build interactive canvases.\n\nAsk for a dashboard or report while the agent works, then share the finished canvas with your team as a link. https://t.co/cLGgGLKrBT", "metrics": {"impressions": 113496, "likes": 2250, "reposts": 120, "replies": 184, "quotes": 67, "bookmarks": 491}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2111193927281975296/img/jmpZoSMCuffYV9Ol.jpg", "duration_ms": 25000, "mp4": "https://video.twimg.com/amplify_video/2111193927281975296/vid/avc1/640x360/F_i_6MOFp6oIKJu0.mp4?tag=16"}], "replies_summary": "Positive on the idea that a shareable dashboard beats agent logs or Slack screenshots, with tips (state the audience; show data source and refresh time) and questions about live data and editing control. A cluster of replies are unrelated billing/refund complaints.", "notable_replies": [{"handle": "@kre8ivtech", "text": "Canvases as the deliverable is the right call. Most stakeholders never read agent logs, they read the dashboard."}, {"handle": "@NoravaleAI", "text": "A shareable canvas link beats pasting agent screenshots into Slack 👀"}, {"handle": "@geminitfwang", "text": "Can shared canvases update after the agent finishes?"}], "gold_standard": false, "screenshot": "shots/2111193957527146711.png", "screenshot_method": "embed", "thumbnail": "thumbs/2111193957527146711.jpg"}, {"id": "2111064794115547404", "url": "https://x.com/simongerman600/status/2111064794115547404", "author": {"handle": "simongerman600", "name": "Simon Kuestenmacher"}, "created_at": "2026-10-16T12:00:43.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Infographic", "tags": [], "derived_tags": ["dataviz", "chart", "education-data"], "description": "A chart of PISA scores comparing first- and second-generation migrant kids with children of locals across countries, with Australia standing out. A reference for a dense comparative chart with confidence intervals that invites close reading.", "text": "In migration-nations (countries that deliberately import worker that are more educated that locals) first and second generation migrant kids record higher PISA scores that the kids of locals. In Australia the trend is particularly strong. To me this is just one variation of https://t.co/vplsOrVbkH", "metrics": {"impressions": 65892, "likes": 470, "reposts": 138, "replies": 44, "quotes": 31, "bookmarks": 223}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "image", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUwCPh-WIAAbbft.jpg", "preview_image_url": null, "duration_ms": null, "mp4": null}], "replies_summary": "The thread quickly becomes a debate about immigration and what drives the gap, with many saying the data should be split by migrants' country of origin. On the chart itself, one reply asks why the confidence interval is so much wider for the US and another adds regional gaps within Spain.", "notable_replies": [{"handle": "@AleksandrN79427", "text": "Why is CI like, 5x wider in the US, making the stat almost meaningless?"}, {"handle": "@CancellationCh1", "text": "Now disaggregate migrants by country from which they migrate"}], "gold_standard": false, "screenshot": "shots/2111064794115547404.png", "screenshot_method": "embed", "thumbnail": "thumbs/2111064794115547404.jpg"}, {"id": "2110857277494169647", "url": "https://x.com/supabase/status/2110857277494169647", "author": {"handle": "supabase", "name": "Supabase"}, "created_at": "2026-10-15T22:16:07.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "developer-tools", "database"], "description": "Supabase announces running Supabase locally without Docker, plus a separate local project per coding agent. Reference for a developer-launch video that leads with a long-requested pain point.", "text": "People have been asking to run Supabase locally without Docker for a while. You can do that now. 🐳\n\nPlus, every coding agent gets its own local project, so one can reset its database while another is mid test run.\n\nhttps://t.co/RZCPtRNfGv https://t.co/bc2WbKRw28", "metrics": {"impressions": 68523, "likes": 708, "reposts": 50, "replies": 67, "quotes": 27, "bookmarks": 405}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/ext_tw_video_thumb/2110857143616192512/pu/img/8x59ejez6bjXFXkW.jpg", "duration_ms": 89708, "mp4": "https://video.twimg.com/ext_tw_video/2110857143616192512/pu/vid/avc1/640x360/LBY2TUGdDaOqgSYb.mp4?tag=12"}], "replies_summary": "Strongly positive and unusually consistent: almost every reply singles out per-agent local projects as the real win, since agents sharing one database cause failures you can't reproduce. Follow-ups ask about lazy-start wake latency, lifecycle and cleanup, and RLS hygiene before deploying.", "notable_replies": [{"handle": "@bullbear_info", "text": "isolation per agent is the actual win here"}, {"handle": "@truongphamit", "text": "Two agents sharing one local db is how you get test failures nobody can reproduce."}, {"handle": "@adityareddydev", "text": "lazy start is the part I'd want a number on."}], "gold_standard": false, "screenshot": "shots/2110857277494169647.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110857277494169647.jpg"}, {"id": "2110853125389029437", "url": "https://x.com/NotionHQ/status/2110853125389029437", "author": {"handle": "NotionHQ", "name": "Notion"}, "created_at": "2026-10-15T21:59:37.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "ai-agents", "no-code"], "description": "Notion's feature demo: button automations can now message agents, so a prompt sits behind a button any teammate can click. Reference for a tight one-feature UI demo with a playful hook ('Your buttons just got a brain 🧠').", "text": "New: Your buttons just got a brain 🧠\n\nButton automations can now message your agents. Add a prompt to a button, and anyone on your team can trigger a workflow with a click. https://t.co/u3L7lcAnlc", "metrics": {"impressions": 56256, "likes": 556, "reposts": 36, "replies": 24, "quotes": 12, "bookmarks": 241}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110846737241788416/img/1IXaVa352qOHNDcj.jpg", "duration_ms": 17133, "mp4": "https://video.twimg.com/amplify_video/2110846737241788416/vid/avc1/640x360/kM66Sqykd_vA6cZH.mp4"}], "replies_summary": "Enthusiastic overall. Many people say a button is the right UX for teammates who will never write a prompt; others share use-case ideas. Critiques ask for per-page button relevance and less clicking, and call the existing automation layer 'archaic'.", "notable_replies": [{"handle": "@openpod__", "text": "Putting the prompt behind a button is underrated. Half the team will never write a prompt, but everyone clicks buttons."}, {"handle": "@faithsteader", "text": "Button properties would be much more useful IMO if it was easier to only show buttons relevant to a particular page in the database"}], "gold_standard": false, "screenshot": "shots/2110853125389029437.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110853125389029437.jpg"}, {"id": "2110841898076418336", "url": "https://x.com/OpenAI/status/2110841898076418336", "author": {"handle": "OpenAI", "name": "OpenAI"}, "created_at": "2026-10-15T21:15:00.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["ai-science", "short-teaser", "brand-video"], "description": "OpenAI's 6-second teaser for the GPT-Rosalind Academic Plan, aimed at university biology labs. A reference for an ultra-short brand clip that carries a niche, research-focused announcement.", "text": "We're expanding access to GPT-Rosalind for academic research.\n\nThe new Rosalind Academic Plan helps scientific labs bring AI into the work of understanding biology, exploring ideas, and deciding what to test next—with sponsored access for eligible labs at U.S. universities.\n\nAcademic research starts with questions whose impact may take years to impact human health.", "metrics": {"impressions": 371382, "likes": 3262, "reposts": 297, "replies": 319, "quotes": 106, "bookmarks": 589}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110841872742858752/img/afsUfyxpTzvudLuz.jpg", "duration_ms": 6041, "mp4": "https://video.twimg.com/amplify_video/2110841872742858752/vid/avc1/640x360/pxJ5-krxw0p_1m9c.mp4"}], "replies_summary": "Replies are broadly supportive of using AI to speed up biology research, several in Chinese noting the right split is human expert judgment plus AI reasoning across literature and data. One reply points out that trust from lab staff is the real hurdle; a chunk of the thread is off-topic chatter with Grok.", "notable_replies": [{"handle": "@kadenfhq43", "text": "Free access is great. The hard part is never the model, it's the lab tech who has to trust it."}, {"handle": "@theazeeztech", "text": "AI’s biggest impact may come from accelerating discoveries we haven’t made yet."}], "gold_standard": false, "screenshot": "shots/2110841898076418336.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110841898076418336.jpg"}, {"id": "2110808586389766404", "url": "https://x.com/vercel/status/2110808586389766404", "author": {"handle": "vercel", "name": "Vercel"}, "created_at": "2026-10-15T19:02:38.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "e-commerce", "brand"], "description": "Vercel introduces its merch store: limited drops and original designs, powered by Next.js, Shopify Hydrogen and eve. Reference for a brand/merch launch video and a storefront used as a stack showcase.", "text": "Introducing https://t.co/KWzuDDlyvD.\n\nLimited drops, original designs, and a few things you didn't see coming.\n\nPowered by @nextjs, @Shopify Hydrogen &amp; @eve. https://t.co/RA6VsKRBRt", "metrics": {"impressions": 60909, "likes": 613, "reposts": 28, "replies": 43, "quotes": 23, "bookmarks": 166}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110808552315244544/img/w09Q-mbbWm35VFDl.jpg", "duration_ms": 28352, "mp4": "https://video.twimg.com/amplify_video/2110808552315244544/vid/avc1/640x360/S8DE2ZxnIkmla5H6.mp4?tag=16"}], "replies_summary": "Mostly hype ('Crazyyy good', 'these are pretty sick'), plus developers praising Next.js + Hydrogen as a clean drop-commerce stack. The top-liked reply complains the racing-themed line isn't 'normal stuff', and others joke about 504 errors and bots.", "notable_replies": [{"handle": "@kerim0x1", "text": "im not a fucking f1 driver or mechanic: im a vibe coder where is normal stuff"}, {"handle": "@Daviswh", "text": "Next.js + Shopify Hydrogen for limited drops is a clean stack for drop commerce."}], "gold_standard": false, "screenshot": "shots/2110808586389766404.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110808586389766404.jpg"}, {"id": "2110797830361436604", "url": "https://x.com/OpenAI/status/2110797830361436604", "author": {"handle": "OpenAI", "name": "OpenAI"}, "created_at": "2026-10-15T18:19:54.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "voice-ui", "ai"], "description": "OpenAI announces GPT-Live-1.1 for ChatGPT Voice (new voices, better accents, fewer 'checking…' pauses), rolling out across ChatGPT, Codex and dots. Reference for an audio-first product video with a three-beat hook line.", "text": "New voices. Better accents. And less \"checking...\"\n\nGPT-Live-1.1 brings these updates to Voice in ChatGPT, Codex, and dots, with new voices in French, German, Hindi, Mexican Spanish, Korean, and Japanese.\n\nRolling out today to all users. Coming soon to the API. https://t.co/L6K8ZUC1xm", "metrics": {"impressions": 1864398, "likes": 11159, "reposts": 802, "replies": 814, "quotes": 553, "bookmarks": 1835}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/media/HUsEKcobYAAf2Bg.jpg", "duration_ms": 40733, "mp4": "https://video.twimg.com/amplify_video/2110784796872024064/vid/avc1/640x360/6RaSXpCT6iP95Hzr.mp4"}], "replies_summary": "Mixed and multilingual: some thanks for new accents (Mexican Spanish), but native speakers question accent authenticity (Japanese, Mexican Spanish). Others ask for more languages (Swahili, Greek) or API timing, and a #Keep4o campaign reply gets the most likes.", "notable_replies": [{"handle": "@SolviedoQuantum", "text": "\"Less checking...\" is the one I care about. Latency is what makes voice feel like a tool or a toy."}, {"handle": "@serg_raya", "text": "Thank you for the Mexican Spanish accent!"}, {"handle": "@0301Net", "text": "That doesn't sound AT ALL mexican."}], "gold_standard": false, "screenshot": "shots/2110797830361436604.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110797830361436604.jpg"}, {"id": "2110793639727358422", "url": "https://x.com/perplexity_ai/status/2110793639727358422", "author": {"handle": "perplexity_ai", "name": "Perplexity"}, "created_at": "2026-10-15T18:03:15.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["model-launch", "short-teaser", "ai-search"], "description": "Perplexity's 12-second clip announcing NVIDIA's Nemotron 3.5 Super VL in Perplexity and the Agent API. A reference for a quick partner-model availability announcement in a consistent brand look.", "text": "NVIDIA’s Nemotron 3.5 Super VL is now available in Perplexity for Pro and Max subscribers, and in Agent API. https://t.co/fMVGtyZFFQ", "metrics": {"impressions": 67211, "likes": 304, "reposts": 17, "replies": 21, "quotes": 8, "bookmarks": 29}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110793610962821120/img/prjLnJl6ktE9IJJk.jpg", "duration_ms": 12066, "mp4": "https://video.twimg.com/amplify_video/2110793610962821120/vid/avc1/640x360/FwbgxGoi_xweq3Xm.mp4?tag=16"}], "replies_summary": "Replies frame it as a distribution play for NVIDIA and are curious about vision use cases like documents and screenshots. Some question why Pro users need it or how it compares on latency, and a few say the model menu keeps getting longer.", "notable_replies": [{"handle": "@Nora_On_AI", "text": "nvidia dropping a model inside perplexity instead of just on hugging face is the bigger story here, feels like a distribution play more than a research flex"}, {"handle": "@Iris97w", "text": "more vision models in the mix is great, haha the model menu keeps getting longer"}], "gold_standard": false, "screenshot": "shots/2110793639727358422.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110793639727358422.jpg"}, {"id": "2110792992697078075", "url": "https://x.com/VisualCap/status/2110792992697078075", "author": {"handle": "VisualCap", "name": "Visual Capitalist"}, "created_at": "2026-10-15T18:00:40.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Infographic", "tags": [], "derived_tags": ["ranking-chart", "finance", "data-visualization"], "description": "Visual Capitalist's 'The World's Largest Banks by Total Assets, 2026': a bubble-cluster infographic on a dark navy background where circles sized by assets are grouped and color-coded by country (China in red, the US in blue, France in purple, and so on), with each bank's logo and rank inside its bubble. A great reference for proportional-area clustering with strong color coding.", "text": "Ranked: The World’s 30 Largest Banks in 2026 🏦 \n\nhttps://t.co/DCjslNOZ7v https://t.co/2BW8Sohv3j", "metrics": {"impressions": 70907, "likes": 508, "reposts": 113, "replies": 10, "quotes": 17, "bookmarks": 192}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "image", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUsK7FgXUAAfSOb.jpg", "preview_image_url": null, "duration_ms": null, "mp4": null}], "replies_summary": "Reactions are about the data, not the design: surprise that the top four banks are Chinese (one reply notes an agricultural bank outranking JPMorgan), a methodological pushback (rank by equity rather than assets) and some off-topic or snarky comments.", "notable_replies": [{"handle": "@Jbond069", "text": "You should rank them by Equity not Assets considering that a large part of them are funded by deposits from clients"}, {"handle": "@JimGilbert409", "text": "Wow, who would’ve imagined the four largest banks would be in China?!?!"}], "gold_standard": false, "screenshot": "shots/2110792992697078075.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110792992697078075.jpg"}, {"id": "2110788459803938944", "url": "https://x.com/vercel/status/2110788459803938944", "author": {"handle": "vercel", "name": "Vercel"}, "created_at": "2026-10-15T17:42:40.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["developer-tools", "feature-launch", "ai-agents"], "description": "Vercel's 22-second announcement that Vercel Drives is generally available for stateful agents, with a one-line caption. A reference for a short, focused feature-GA video in Vercel's minimal style.", "text": "Vercel Drives is generally available. You can now run stateful agents on Vercel.\n\nhttps://t.co/tbogIYouct https://t.co/etKyIfIQr4", "metrics": {"impressions": 84944, "likes": 656, "reposts": 40, "replies": 52, "quotes": 26, "bookmarks": 247}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110788429055410176/img/Ihdyq20u8QnzT6yH.jpg", "duration_ms": 21700, "mp4": "https://video.twimg.com/amplify_video/2110788429055410176/vid/avc1/640x360/WK_ztYORmWl3M4EM.mp4?tag=16"}], "replies_summary": "Developers welcome persistent state for agents, saying stateless agents are just chat with extra steps. Most replies are technical follow-ups about recovery, concurrent writes to the same checkpoint, and access controls.", "notable_replies": [{"handle": "@ravixalgorithm", "text": "stateless was the easy half. agents that forget between runs aren't agents, they're chat with extra steps"}, {"handle": "@SMishra61", "text": "the test i'd immediately throw at a stateful agent is killing it halfway through a tool call. persisting files is one piece, but recovering without replaying a side effect twice is where i'd expect the more painful bugs."}], "gold_standard": false, "screenshot": "shots/2110788459803938944.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110788459803938944.jpg"}, {"id": "2110786348131258456", "url": "https://x.com/vercel/status/2110786348131258456", "author": {"handle": "vercel", "name": "Vercel"}, "created_at": "2026-10-15T17:34:16.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["developer-tools", "feature-launch", "motion-graphics"], "description": "Vercel's 12-second launch clip for running backends on Vercel (Python GA, containers, daemons), paired with a tight three-bullet caption. A reference for a minimal, on-brand dev-tool feature announcement.", "text": "Run your backend on Vercel.\n\n• Python is generally available\n• Containers for other runtimes &amp; system libraries\n• Daemons for async jobs &amp; background workers\n\nhttps://t.co/spPCQWUaWc https://t.co/H1lvSQE81d", "metrics": {"impressions": 121540, "likes": 974, "reposts": 67, "replies": 55, "quotes": 42, "bookmarks": 268}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110786322348867584/img/JkFlHQMD3lj30HLV.jpg", "duration_ms": 12078, "mp4": "https://video.twimg.com/amplify_video/2110786322348867584/vid/avc1/640x360/gotTbtDcpBTT773i.mp4?tag=16"}], "replies_summary": "Developers are mostly positive: Python GA is called a big deal for AI backends living next to the frontend, and daemons are called the unlock for watcher loops. Others ask practical questions about deploy behavior for long-running workers, and a few gripe about pricing or ask Vercel to buy Railway.", "notable_replies": [{"handle": "@justmetolife", "text": "python being generally available is a big one. most ai backends are written in it, so they can now live right next to the frontend"}, {"handle": "@alertshelfkn", "text": "Daemons for async jobs is the unlock. A watcher loop without a daemon was always the awkward part. Verifying the free tier limits before I move anything."}], "gold_standard": false, "screenshot": "shots/2110786348131258456.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110786348131258456.jpg"}, {"id": "2110768162811867608", "url": "https://x.com/screenstudio/status/2110768162811867608", "author": {"handle": "screenstudio", "name": "Screen Studio"}, "created_at": "2026-10-15T16:22:00.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "screen-recording", "motion"], "description": "Screen Studio introduces Glass Loupe, which magnifies just part of the screen instead of zooming the whole recording. A strong reference for app intro/demo videos: the tool itself is used to make polished product demos, and the post demos a lens-style magnifier effect.", "text": "Introducing Glass Loupe in Screen Studio.\n\nMagnify just the part that matters, without zooming the whole screen. https://t.co/Jd3WNDJ1Ri", "metrics": {"impressions": 72884, "likes": 38, "reposts": 5, "replies": 4, "quotes": 0, "bookmarks": 6}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110767445937971200/img/GX83GKG5oTA0a4T9.jpg", "duration_ms": 32791, "mp4": "https://video.twimg.com/amplify_video/2110767445937971200/vid/avc1/480x852/tcV0wN4Rhh4jxglw.mp4"}], "replies_summary": "Positive ('such a helpful addition'). The main thread is a subscriber wishing agents could drive Screen Studio via CLI/MCP, and the maker replies that it's planned but they want to do it well. Another founder asks whether the shot is real.", "notable_replies": [{"handle": "@Kingx191", "text": "Such a helpful addition for focusing on key details while presenting"}, {"handle": "@AL8ATROS", "text": "This is something we will add, but we want to make it good, not just for the sake of having it :)"}], "gold_standard": false, "screenshot": "shots/2110768162811867608.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110768162811867608.jpg"}, {"id": "2110743785315410262", "url": "https://x.com/Mastercard/status/2110743785315410262", "author": {"handle": "Mastercard", "name": "Mastercard"}, "created_at": "2026-10-15T14:45:08.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["fintech", "payments", "brand-video"], "description": "Mastercard's 66-second launch film for the Global Money Platform with BVNK (stablecoin payments, payouts, cards and multi-currency accounts via one integration). A reference for how a large brand explains a complex multi-product platform in one polished video.", "text": "Today, we're launching Mastercard Global Money Platform with @BVNKFinance, enabling banks, fintechs, and enterprises to offer stablecoin payments, local bank payouts, spend stablecoin-linked cards, and multi-currency accounts through a single integration. Learn more: https://t.co/KcGwXFRMup", "metrics": {"impressions": 109445, "likes": 1887, "reposts": 418, "replies": 110, "quotes": 92, "bookmarks": 256}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110743591941193728/img/i_qg-uaSCxTNBqGX.jpg", "duration_ms": 66133, "mp4": "https://video.twimg.com/amplify_video/2110743591941193728/vid/avc1/640x360/3rQD2eKBr_oPqmk8.mp4"}], "replies_summary": "Replies are largely from payments and crypto-adjacent accounts calling stablecoin payouts at card-network scale the quiet headline of the year. A few raise practical questions, such as what happens when the onchain leg succeeds but the bank payout fails, and one notes the extra fee lines to read through.", "notable_replies": [{"handle": "@SinaEstavi", "text": "Stablecoin payouts at Mastercard scale is the boring headline that matters most this year. The rails fight is ending. Now it's about who builds the best apps on top."}, {"handle": "@0xspiked", "text": "what happens when the onchain leg succeeds but the local bank payout gets rejected? is the return path handled inside the same integration?"}, {"handle": "@kranthi95223317", "text": "One integration, four products, and a whole new set of fee lines to read through."}], "gold_standard": false, "screenshot": "shots/2110743785315410262.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110743785315410262.jpg"}, {"id": "2110618179982749940", "url": "https://x.com/figma/status/2110618179982749940", "author": {"handle": "figma", "name": "Figma"}, "created_at": "2026-10-15T06:26:02.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["config", "design-tools", "launch-recap"], "description": "Figma's 50-second Config India recap introducing Code Layers, Specs, Guidelines, Code Sources and Payload in one cut. A good reference for packing a multi-feature keynote announcement into a single paced launch video with an arrow-list caption.", "text": "Today at Config India, we announced new ways of building in Figma\n\n→ Collab with code on the canvas with Code Layers (open beta) \n→ Shape and share context with Specs (open beta) \n→ Give your agent more design system context with Guidelines (open beta) and Code Sources (closed beta)\n→ Ship websites with Payload (rolling out in the coming weeks)", "metrics": {"impressions": 5315561, "likes": 804, "reposts": 61, "replies": 36, "quotes": 32, "bookmarks": 138}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110617950222979073/img/SPi3-2DxBI9oBkU5.jpg", "duration_ms": 50000, "mp4": "https://video.twimg.com/amplify_video/2110617950222979073/vid/avc1/640x360/1xxhx2OsWpCbjq4o.mp4"}], "replies_summary": "Most top replies are off-topic (spam, link drops, unrelated asks), with a handful of short positive takes on collaboration. The most substantive thread is a user asking Figma staff whether Specs flags when a component changes but the written spec doesn't, and a Figma team member says that's in line with where they're taking Specs next.", "notable_replies": [{"handle": "@luis_usaa", "text": "new features in figma look promising for collaboration"}, {"handle": "@_johnnydallas_", "text": "Not yet, but this is inline with some of our thinking for where to take Specs next :)"}], "gold_standard": false, "screenshot": "shots/2110618179982749940.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110618179982749940.jpg"}, {"id": "2110606384761069955", "url": "https://x.com/figma/status/2110606384761069955", "author": {"handle": "figma", "name": "Figma"}, "created_at": "2026-10-15T05:39:09.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "figma", "config"], "description": "Figma introduces Specs, a collaborative markdown medium with Figma-specific visual features, announced live from Config India. Reference for a keynote-style feature reveal video that explains a new primitive ('a new medium for markdown') in one sentence.", "text": "Introducing Specs: a new medium for markdown that brings context into, out of, and across Figma AND it’s collaborative AND has unique-to-Figma visual features\n\nLive from Config India https://t.co/i3F4FwAu4I", "metrics": {"impressions": 3754977, "likes": 1217, "reposts": 81, "replies": 36, "quotes": 37, "bookmarks": 364}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110606045416660992/img/htr6XD_83IJf6Qj9.jpg", "duration_ms": 40750, "mp4": "https://video.twimg.com/amplify_video/2110606045416660992/vid/avc1/640x360/fzzaJG5-SCMfEQCA.mp4"}], "replies_summary": "Mostly positive: many see markdown as the shared interface between humans and agents and like keeping the 'why' next to the frame. Critics question the name, ask how Specs differ from annotations, or call it bloat.", "notable_replies": [{"handle": "@archrainey", "text": "Markdown is becoming the interface between humans and agents."}, {"handle": "@UchihaSomil", "text": "Keeping the \"why\" next to the frame is the useful part. Most specs die in a doc nobody reopens after handoff."}, {"handle": "@m00kieblayl0ck", "text": "Oof terrible name for this. It's just markdown docs?"}], "gold_standard": false, "screenshot": "shots/2110606384761069955.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110606384761069955.jpg"}, {"id": "2110603044346052714", "url": "https://x.com/figma/status/2110603044346052714", "author": {"handle": "figma", "name": "Figma"}, "created_at": "2026-10-15T05:25:53.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "figma", "browser-extension"], "description": "Figma shows its Chrome extension capturing a live website's code and bringing it into Figma as a code layer (Config India). Reference for a casual, meme-voiced launch post ('Wake up babe…') backed by a short capture-to-canvas demo.", "text": "Wake up babe the Figma Chrome extension can now capture your website code and bring into Figma as a code layer \n\nLive from Config India https://t.co/im2awSct2o", "metrics": {"impressions": 5493464, "likes": 2683, "reposts": 177, "replies": 93, "quotes": 115, "bookmarks": 1535}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110597008440606720/img/D1LN2Idggumc1mET.jpg", "duration_ms": 31166, "mp4": "https://video.twimg.com/amplify_video/2110597008440606720/vid/avc1/640x360/79A8m1yphmHWiTte.mp4"}], "replies_summary": "The most polarized reply section in the set: many replies joke or worry that capturing any site makes copying designs effortless ('even stealing will be low to zero effort now'), with ironic '\"your\" website' jabs. A few ask practical questions, such as whether captured layers stay responsive across frame sizes.", "notable_replies": [{"handle": "@wojototo", "text": "Oh for fucks sake - even stealing will be low to zero effort now 😃"}, {"handle": "@BlastProjects", "text": "Does the captured code layer retain responsive behavior across frame sizes?"}], "gold_standard": false, "screenshot": "shots/2110603044346052714.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110603044346052714.jpg"}, {"id": "2110600144525853007", "url": "https://x.com/figma/status/2110600144525853007", "author": {"handle": "figma", "name": "Figma"}, "created_at": "2026-10-15T05:14:22.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "figma", "design-to-code"], "description": "Figma's headline Config India launch: Code Layers (open beta), putting design and code together on the canvas. A high-reach reference (5M+ impressions) for a short, confident tagline ('Together at last') over a hero product video.", "text": "Together at last: design and code on the canvas\n\nCode Layers are here, now in open beta\n\nLive from Config India https://t.co/8agUANrm8w", "metrics": {"impressions": 5118779, "likes": 838, "reposts": 44, "replies": 22, "quotes": 22, "bookmarks": 167}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110596664105041920/img/eh8t3-Fy64kZRnmf.jpg", "duration_ms": 34833, "mp4": "https://video.twimg.com/amplify_video/2110596664105041920/vid/avc1/640x360/NNdwHfrj8aApX7Gg.mp4"}], "replies_summary": "Largely excited ('Canvas is code!'), with designers relieved at no longer screenshotting layouts for engineers and some speculation that 'handoff' stops being a job. There's some job-anxiety snark and a question about how prototype connectors render to code.", "notable_replies": [{"handle": "@acream_1", "text": "Canvas is code!🙌🏻🌟"}, {"handle": "@lilfourndev", "text": "design and code on one canvas is the thing people kept faking with screenshots."}, {"handle": "@lucyxxfeatherr", "text": "the real flex is finally not having to screenshot my figma to explain a layout to engineering"}], "gold_standard": false, "screenshot": "shots/2110600144525853007.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110600144525853007.jpg"}, {"id": "2110410655165779985", "url": "https://x.com/shadcn/status/2110410655165779985", "author": {"handle": "shadcn", "name": "shadcn"}, "created_at": "2026-10-14T16:41:24.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["ui-components", "ai-ui", "design-system"], "description": "shadcn publishes Trace, a component for agent activity that unifies reasoning, tool calls, queues, chain-of-thought and subagents, alongside Code Block and AI Elements. Reference for agent/AI UI patterns and a component launch demo.", "text": "I just published Trace, a new component for agent activity. It's one abstraction for reasoning, tool calls, queues, chain of thought, subagents...etc\n\nAlso in this release: Code Block and AI Elements.\n\nhttps://t.co/gWDSPBII1c https://t.co/302yiOO8Lp", "metrics": {"impressions": 172538, "likes": 4571, "reposts": 143, "replies": 137, "quotes": 38, "bookmarks": 2877}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2110410297529753600/img/tP8L9vBubLGBz-1w.jpg", "duration_ms": 16666, "mp4": "https://video.twimg.com/amplify_video/2110410297529753600/vid/avc1/484x360/5DIMEtp5c29294U-.mp4"}], "replies_summary": "Very positive ('Design king', 'been waiting for this'), with builders saying one abstraction for agent activity is overdue because watching an agent work is part of trusting it. Requests include replayable serialized traces and diff views.", "notable_replies": [{"handle": "@PinakCorp", "text": "Watching an agent work is half of trusting it."}, {"handle": "@paymentsandbox", "text": "does it emit a serialized trace you can replay?"}], "gold_standard": false, "screenshot": "shots/2110410655165779985.png", "screenshot_method": "embed", "thumbnail": "thumbs/2110410655165779985.jpg"}, {"id": "2109639214723932495", "url": "https://x.com/bettersayAJ/status/2109639214723932495", "author": {"handle": "bettersayAJ", "name": "ajay yadav"}, "created_at": "2026-10-12T13:35:58.000Z", "collected_at": "2026-10-19T01:17:03Z", "category": "Product Intro", "tags": [], "derived_tags": ["startup-launch", "founder-video", "ai-agents"], "description": "Founder launch video for neatlogs, an agent observability tool, opening on a two-line hook (\"building agents is easy / getting them to production is hard\"). A reference for a founder-led startup launch built around one sharp problem statement.", "text": "building agents is easy\n\ngetting them to production is hard\n\ntoday we’re launching @neatlogs to fix that https://t.co/IwhlPk2kR1", "metrics": {"impressions": 151697, "likes": 468, "reposts": 62, "replies": 110, "quotes": 228, "bookmarks": 187}, "metrics_updated_at": "2026-10-19T01:17:03Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/media/HUbwUr_asAA7mvu.jpg", "duration_ms": 155767, "mp4": "https://video.twimg.com/amplify_video/2109637713544769536/vid/avc1/640x360/JKivTYkASgZOagTG.mp4"}], "replies_summary": "Mostly congratulations, with one reply calling the launch \"super sleek\". A few practitioners engage with the pitch, agreeing production is where logging and retries eat time and asking whether neatlogs can separate provider changes from input changes; one asks how they demo it in under a minute.", "notable_replies": [{"handle": "@dynaayoW", "text": "Congrats!  Launch was super sleek ❤️"}, {"handle": "@xiao_2146", "text": "That split is exactly right. Demo agents are cheap; production is where logging, retries, and “why did it do that” eat the week. Rooting for neatlogs."}, {"handle": "@kaify_co", "text": "Agents to production is the part most tools skip showing tbh.  How do you usually demo neatlogs in under a minute?"}], "gold_standard": false, "screenshot": "shots/2109639214723932495.png", "screenshot_method": "embed", "thumbnail": "thumbs/2109639214723932495.jpg"}, {"id": "2108593170569175495", "url": "https://x.com/jh3yy/status/2108593170569175495", "author": {"handle": "jh3yy", "name": "jhey ʕ•ᴥ•ʔ"}, "created_at": "2026-10-09T16:19:22.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Animated Website", "tags": [], "derived_tags": ["css", "mix-blend-mode", "web-animation"], "description": "Jhey's CSS micro-tutorial: knockout text using mix-blend-mode: multiply on a black/white 'sticker', shown as an animated demo with the code in the post. Reference for web text effects and teaching CSS techniques through motion.", "text": "reminder: you can use css mix-blend-mode to create knockout text ↓ 🧑‍🍳\n\n.sticker {\n  background: #000;\n  color: #​fff;\n  mix-blend-mode: multiply;\n} https://t.co/BqKdvHtQJK", "metrics": {"impressions": 54223, "likes": 2166, "reposts": 137, "replies": 49, "quotes": 6, "bookmarks": 1630}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2108590602988265472/img/RU0JG67QaZS2CgNC.jpg", "duration_ms": 25600, "mp4": "https://video.twimg.com/amplify_video/2108590602988265472/vid/avc1/540x540/p4WSwfm56TmpvpvN.mp4"}], "replies_summary": "Delighted ('What is this sorcery', 'such a tasty little trick') with practical notes: multiply is simpler than background-clip, watch for color shifts on non-white backgrounds, and which layer needs isolation: isolate.", "notable_replies": [{"handle": "@tochukwudev", "text": "never thought of using multiply for this, way simpler than background-clip"}, {"handle": "@Sqwn1405", "text": "multiply is clutch but watch out for color shifts on non-white backgrounds"}], "gold_standard": false, "screenshot": "shots/2108593170569175495.png", "screenshot_method": "embed", "thumbnail": "thumbs/2108593170569175495.jpg"}, {"id": "2108574564586332615", "url": "https://x.com/shadcn/status/2108574564586332615", "author": {"handle": "shadcn", "name": "shadcn"}, "created_at": "2026-10-09T15:05:26.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["design-system", "design-tokens", "product-demo"], "description": "shadcn demos the shadcn/ui skills generating a full DESIGN.md design system from a preset: colors, tokens, type scale, elevation, and styled primitives and blocks. Reference for showing a design-system generator end to end.", "text": "Alright, I've made the shadcn/ui skills really good at 𝙳𝙴𝚂𝙸𝙶𝙽.𝚖𝚍.\n\nAsk for a design system and it picks a preset, then builds everything: colors, tokens, type scale, elevation, styles the primitives and blocks.\n\nStart with a solid foundation and build something unique. https://t.co/ezBQ1D9FHc", "metrics": {"impressions": 237783, "likes": 4106, "reposts": 187, "replies": 96, "quotes": 22, "bookmarks": 4589}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2108574065321512961/img/xMEdbpAf1J-zJ11s.jpg", "duration_ms": 28766, "mp4": "https://video.twimg.com/amplify_video/2108574065321512961/vid/avc1/640x360/AwrvEecDXxnk9_rk.mp4"}], "replies_summary": "Interested and practical: the most common question is how it handles an app with an existing visual identity or tokens. One suggestion is to make tokens self-enforcing (fail the build on contrast), and some joke about stakeholder workshops.", "notable_replies": [{"handle": "@buildinothing", "text": "how does it handle a project with an existing visual identity?"}, {"handle": "@adityareddydev", "text": "the real test is whether the next screen uses those tokens instead of inventing twelve new shades of gray"}], "gold_standard": false, "screenshot": "shots/2108574564586332615.png", "screenshot_method": "embed", "thumbnail": "thumbs/2108574564586332615.jpg"}, {"id": "2108531407786242389", "url": "https://x.com/emilkowalski/status/2108531407786242389", "author": {"handle": "emilkowalski", "name": "Emil Kowalski"}, "created_at": "2026-10-09T12:13:56.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Animated Website", "tags": [], "derived_tags": ["motion-principles", "ui-animation", "easing"], "description": "Emil Kowalski on a motion-design principle for UI: bigger elements (and longer distances) should animate more slowly because they feel heavier, illustrated with a hand vs. cursors animation. Reference for animation timing on websites and interfaces.", "text": "The bigger an animated element is, the slower it should move.\n\nNotice how the hand on the right moves much slower than the cursors on the left. That’s because it feels heavier.\n\nThe same applies to distance. The more an element has to travel, the longer the animation should be. https://t.co/lFDygrDF4u", "metrics": {"impressions": 60445, "likes": 2377, "reposts": 49, "replies": 46, "quotes": 13, "bookmarks": 1031}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2108520770905296896/img/RmlbrETnlpaQ8LkP.jpg", "duration_ms": 6033, "mp4": "https://video.twimg.com/amplify_video/2108520770905296896/vid/avc1/630x360/Up2PvWeJ12kw4yWp.mp4"}], "replies_summary": "Strong agreement that matching mass/distance to duration is what makes motion 'feel right'. Commenters extend it to static spacing and ask whether to scale duration linearly; motion-school folks note it's a classic principle.", "notable_replies": [{"handle": "@shahbazubair", "text": "Works for static layouts too. The bigger the element, the more room it needs around it.  Same physics, just frozen."}, {"handle": "@ys_sen", "text": "this is the kind of detail that separates \"works\" from \"feels right\"."}, {"handle": "@rsms", "text": "E=mc²"}], "gold_standard": false, "screenshot": "shots/2108531407786242389.png", "screenshot_method": "embed", "thumbnail": "thumbs/2108531407786242389.jpg"}, {"id": "2107166904188338534", "url": "https://x.com/jh3yy/status/2107166904188338534", "author": {"handle": "jh3yy", "name": "jhey ʕ•ᴥ•ʔ"}, "created_at": "2026-10-05T17:51:53.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Animated Website", "tags": [], "derived_tags": ["css", "backdrop-filter", "web-animation"], "description": "Jhey compares progressive (layered) blur with masked blur in CSS, with a visualization of the stacked blur layers. Reference for glassy nav/hero effects on marketing sites.", "text": "progressive blur &gt; masked blur 🧑‍🍳\n\nmaskin' jus' fades it, layers can progress it ↓ https://t.co/8dot1FLQeA https://t.co/YceSWaCGyB", "metrics": {"impressions": 71583, "likes": 2020, "reposts": 107, "replies": 25, "quotes": 3, "bookmarks": 1757}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2107166725661708288/img/iqOQy2JIEVx0JNDX.jpg", "duration_ms": 21917, "mp4": "https://video.twimg.com/amplify_video/2107166725661708288/vid/avc1/540x540/LDAnHoet5nk1XYqh.mp4"}], "replies_summary": "Admiring ('goated CSS wizard') and appreciative of how the blur layers are visualized. The main concern is performance: stacking blur layers can lag, especially on mobile Safari, which is why masked blur exists. One designer argues for composing images so you don't need blur at all.", "notable_replies": [{"handle": "@lukalotl", "text": "it nukes the perf which is why we invented masked blur."}, {"handle": "@paakjong", "text": "i love how you visualized the blur layers"}, {"handle": "@abdul_quadir_a", "text": "saving this for the next marketing site with a glass nav"}], "gold_standard": false, "screenshot": "shots/2107166904188338534.png", "screenshot_method": "embed", "thumbnail": "thumbs/2107166904188338534.jpg"}, {"id": "2107163345606582307", "url": "https://x.com/obsdmd/status/2107163345606582307", "author": {"handle": "obsdmd", "name": "Obsidian"}, "created_at": "2026-10-05T17:37:45.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["release-video", "productivity", "markdown"], "description": "Obsidian 1.14 release video covering five improvements: editing markdown outside the vault, macOS Quick Look previews, iOS Quick Capture, Kanban/grouping in Bases, and highlight colors. Reference for a numbered multi-feature release reel.", "text": "Obsidian 1.14 is now available with five major improvements:\n\n1. Edit Markdown files outside your vault\n2. Preview files using macOS Quick Look when the app is closed\n3. Instantly add notes with Quick Capture on iOS\n4. Kanban and new grouping options in Bases\n5. Highlight colors https://t.co/geYqv63w2J", "metrics": {"impressions": 154548, "likes": 1882, "reposts": 133, "replies": 49, "quotes": 25, "bookmarks": 431}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2107160124121067520/img/dyZJCKeK9nO8wOGN.jpg", "duration_ms": 9333, "mp4": "https://video.twimg.com/amplify_video/2107160124121067520/vid/avc1/548x360/u9QbOUYqrYlMzML5.mp4"}], "replies_summary": "Appreciative, with users seeing outside-the-vault editing as the headline because so much markdown now lives in repos (READMEs, agent instruction files). Replies also bring requests (Android quick capture, a VS Code extension, merged task management) and small bug reports.", "notable_replies": [{"handle": "@RandyNorthrup", "text": "Editing Markdown outside the vault is the big one. A lot of Markdown now lives in repos"}, {"handle": "@eggbaby", "text": "A fleeting idea shouldn't have to survive a loading screen before it becomes"}, {"handle": "@karolgost_", "text": "Any plans for Android quick capture? 👀"}], "gold_standard": false, "screenshot": "shots/2107163345606582307.png", "screenshot_method": "embed", "thumbnail": "thumbs/2107163345606582307.jpg"}, {"id": "2106007036324438159", "url": "https://x.com/WalshyDev/status/2106007036324438159", "author": {"handle": "WalshyDev", "name": "Walshy"}, "created_at": "2026-10-02T13:02:59.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Product Intro", "tags": [], "derived_tags": ["launch-video", "observability", "dashboard-ui"], "description": "Cloudflare Traces launch video: a timeline view of requests passing through Cloudflare that answers why a request was blocked, failed or was slow. Good reference for problem-led launch copy (three 'Why…?' questions) paired with a product walkthrough video.", "text": "Introducing Cloudflare Traces\n\nToday we're launching Cloudflare Traces, a way for you to get an unprecedented view into requests going through Cloudflare!\n\nWhy was a request blocked?\nWhy did a request fail?\nWhy was a request slow?\n\nFind out with Traces!\n\nhttps://t.co/5HinGUfmhX", "metrics": {"impressions": 51830, "likes": 548, "reposts": 52, "replies": 20, "quotes": 16, "bookmarks": 260}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2106006993823571968/img/CIE_Q1LwKMJF9vm9.jpg", "duration_ms": 43400, "mp4": "https://video.twimg.com/amplify_video/2106006993823571968/vid/avc1/640x360/9AA2CP2Co3wd11LA.mp4"}], "replies_summary": "Positive, technically engaged audience: people like seeing rewrites, firewall decisions and origin wait time on one request timeline instead of cross-checking separate logs. Follow-up questions focus on OpenTelemetry compliance, trace-context propagation in Workers, request-ID pivoting and retention.", "notable_replies": [{"handle": "@chikuwabu_algo", "text": "Seeing URL rewrites and the wait for the origin in one timeline is the useful part for me."}, {"handle": "@dartasticio", "text": "Is it OpenTelemetry compliant?"}, {"handle": "@jachands", "text": "What. This is amazing omg"}], "gold_standard": false, "screenshot": "shots/2106007036324438159.png", "screenshot_method": "embed", "thumbnail": "thumbs/2106007036324438159.jpg"}, {"id": "2105353453815861370", "url": "https://x.com/warpdotdev/status/2105353453815861370", "author": {"handle": "warpdotdev", "name": "Warp"}, "created_at": "2026-09-30T17:45:53.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "ai-agents", "developer-tools"], "description": "Warp introduces Warp Factories, 'Terraform for agents': one repository that configures agents, automations, access/environments and measurement as code. A very high-reach (~955K impressions) reference for explaining an abstract platform concept with an analogy plus a demo video.", "text": "Agents are getting complex to manage: models, skills, automations, permissions, cloud environments, orchestration patterns...\n\nSo, we built the Terraform for agents: one repository that configures all of your agents as code.\n\nThe Warp Factories configuration spec defines:\n- Agents and orchestration: how work gets routed and which models agents use\n- Automations: the events and schedules that kick off work\n- Access and environments: repositories, secrets, MCP servers, and runners\n- Measurement: scorers and benchmarks for understanding and improving performance\n\nBecause it’s all code, both engineers and agents can propose changes to the factory itself. That makes it possible to test new configurations, benchmark them, and even have your factory propose improvements as PRs.", "metrics": {"impressions": 955198, "likes": 90, "reposts": 6, "replies": 8, "quotes": 3, "bookmarks": 79}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2105350862423867392/img/TIqtC-7w0SCnj7ht.jpg", "duration_ms": 21250, "mp4": "https://video.twimg.com/amplify_video/2105350862423867392/vid/avc1/486x360/HMxxst3tgQZla5IT.mp4"}], "replies_summary": "Engaged and mostly constructive: replies agree that managing agents is becoming its own discipline and that agents-as-code is the right shape. They raise version pinning, permissions and revoke paths, with some irony about writing YAML to manage AI.", "notable_replies": [{"handle": "@therealhacker97", "text": "we've come full circle: AI was supposed to delete YAML. now we're writing YAML to manage the AI."}, {"handle": "@rudraxx13", "text": "managing agents is becoming its own discipline."}], "gold_standard": false, "screenshot": "shots/2105353453815861370.png", "screenshot_method": "embed", "thumbnail": "thumbs/2105353453815861370.jpg"}, {"id": "2104980061405508023", "url": "https://x.com/obsdmd/status/2104980061405508023", "author": {"handle": "obsdmd", "name": "Obsidian"}, "created_at": "2026-09-29T17:02:09.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "macos", "markdown"], "description": "Short Obsidian demo of macOS Quick Look previews for markdown files (1.14.3 early access), even when the app isn't open. Reference for a micro-demo that shows a single OS-level interaction.", "text": "macOS Quick Look is in Obsidian 1.14.3 (early access) so you can instantly preview Markdown files even if the app isn't open https://t.co/dP0HcE35Df", "metrics": {"impressions": 85232, "likes": 580, "reposts": 28, "replies": 26, "quotes": 6, "bookmarks": 118}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2104979840223109120/img/zVOzOKRPBT2LVgDN.jpg", "duration_ms": 9333, "mp4": "https://video.twimg.com/amplify_video/2104979840223109120/vid/avc1/548x360/R4ZfMUHaQ8QQKJEN.mp4"}], "replies_summary": "Excited ('waited for this for so long', 'game changer') with a few skeptics noting existing plugins. Much of the thread is support: plain-text previews until the insider installer is used, and confusion about getting the beta installer via Discord.", "notable_replies": [{"handle": "@paakjong", "text": "wtf this game changer. no more opening the whole vault just to check one file."}, {"handle": "@CaptSolo", "text": "needed to get the insider-preview version of the Obsidian installer, too. Now Markdown previews look beautiful! 😃"}], "gold_standard": false, "screenshot": "shots/2104980061405508023.png", "screenshot_method": "embed", "thumbnail": "thumbs/2104980061405508023.jpg"}, {"id": "2103289058772586872", "url": "https://x.com/zeddotdev/status/2103289058772586872", "author": {"handle": "zeddotdev", "name": "Zed"}, "created_at": "2026-09-25T01:02:43.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "App Intro", "tags": [], "derived_tags": ["product-demo", "code-editor", "settings-ui"], "description": "Zed editor demo showing a single setting that removes every AI-related feature, with a cheeky 'Not a VS Code fork, btw…'. Reference for a personality-driven, one-toggle product clip.", "text": "A single setting removes every AI-related feature in Zed.\n\nNot a VS Code fork, btw... https://t.co/dp1LVb2czW https://t.co/O42VUB2WhZ", "metrics": {"impressions": 268975, "likes": 4534, "reposts": 147, "replies": 171, "quotes": 48, "bookmarks": 532}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "video", "media": [{"type": "video", "url": null, "preview_image_url": "https://pbs.twimg.com/amplify_video_thumb/2103288803171434496/img/6lVlEI1eqHiHvYad.jpg", "duration_ms": 6766, "mp4": "https://video.twimg.com/amplify_video/2103288803171434496/vid/avc1/562x360/q-KH3QNu9NUTb2qc.mp4"}], "replies_summary": "Mostly warm brand affection ('Love ya Zed', 'whoever runs this account deserves a raise'), with some 'why?' and 'VS Code has that too' replies plus feature requests (git tooling) and a critique to ship tooling instead of wrappers.", "notable_replies": [{"handle": "@pcstyle53", "text": "whoever runs this account deserves a raise lol"}, {"handle": "@rannjiit", "text": "vscode has that setting too"}], "gold_standard": false, "screenshot": "shots/2103289058772586872.png", "screenshot_method": "embed", "thumbnail": "thumbs/2103289058772586872.jpg"}, {"id": "2101446770328748397", "url": "https://x.com/VisualCap/status/2101446770328748397", "author": {"handle": "VisualCap", "name": "Visual Capitalist"}, "created_at": "2026-09-19T23:02:07.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Infographic", "tags": [], "derived_tags": ["ranking-chart", "finance", "data-visualization"], "description": "Visual Capitalist's 'Top 20 Foreign Holders of U.S. Debt' (by Aneesh Anand, made with Voronoi): an editorial horizontal bar chart with flag rows, a serif headline, short callout annotations and a right-hand column of proportional red/teal circles showing annual change. A reference for combining a ranking with a delta column in one table-like chart.", "text": "Ranked: Which Countries Hold the Most U.S. Debt? 💵 \n\nThis graphic by Aneesh Anand is one of the many incredible data-driven charts and stories from creators featured on our @VoronoiApp. ✅\n\nhttps://t.co/srdzUkjZCX https://t.co/gIzEIpHB4V", "metrics": {"impressions": 65881, "likes": 335, "reposts": 108, "replies": 14, "quotes": 12, "bookmarks": 100}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "image", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSnWlWxWEAA_JOa.jpg", "preview_image_url": null, "duration_ms": null, "mp4": null}], "replies_summary": "Discussion centers on data interpretation: custodian countries (Belgium, Cayman Islands) vs. beneficial ownership, the share held domestically, and missing countries (Germany). Several replies praise the annual-change column as just as important as the rank.", "notable_replies": [{"handle": "@Optimas09", "text": "The annual changes column on the right is just as important."}, {"handle": "@TSimonts", "text": "I like the chart, but Belgium being a huge custodian (think China, ...) means the $482,5bln doesn't equal beneficial ownership"}], "gold_standard": false, "screenshot": "shots/2101446770328748397.png", "screenshot_method": "embed", "thumbnail": "thumbs/2101446770328748397.jpg"}, {"id": "2100737110500053307", "url": "https://x.com/VisualCap/status/2100737110500053307", "author": {"handle": "VisualCap", "name": "Visual Capitalist"}, "created_at": "2026-09-18T00:02:11.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Infographic", "tags": [], "derived_tags": ["ranking-chart", "cities", "data-visualization"], "description": "Visual Capitalist's 'US cities ranked by quality of life per dollar' (by Valerii Emelianov, Numbeo data): a two-column lollipop/dot ranking of 41 cities, color-coded by region with the top 10 ringed. A reference for a clean, high-density ranking layout on a warm off-white background.", "text": "Ranked: Where Your Money Buys the Best Life in America 💵\n\nThis graphic by Valerii Emelianov is one of the many incredible data-driven charts and stories from creators featured on our website. ✅\n\nhttps://t.co/iYXJQb82wE https://t.co/EPWltS0eUG", "metrics": {"impressions": 104854, "likes": 387, "reposts": 60, "replies": 42, "quotes": 13, "bookmarks": 343}, "metrics_updated_at": "2026-10-17T18:51:41Z", "media_type": "image", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSdRJwoWAAAxlxC.jpg", "preview_image_url": null, "duration_ms": null, "mp4": null}], "replies_summary": "Largely skeptical and local: many replies dispute the rankings or point to missing cities (Salt Lake City, Pittsburgh, Boise), call it click-bait, or joke about specific cities. Grok replies explain that the source covered only 41 Numbeo cities.", "notable_replies": [{"handle": "@theripsnorter", "text": "15 cities were left out of the 56 from which the data was sourced."}, {"handle": "@ThePandoRando", "text": "The more I study Visual Capitalist's graphics, the more I feel being misinformed."}], "gold_standard": false, "screenshot": "shots/2100737110500053307.png", "screenshot_method": "embed", "thumbnail": "thumbs/2100737110500053307.jpg"}, {"id": "2098245666279415955", "url": "https://x.com/VisualCap/status/2098245666279415955", "author": {"handle": "VisualCap", "name": "Visual Capitalist"}, "created_at": "2026-09-11T03:02:05.000Z", "collected_at": "2026-10-17T18:51:41Z", "category": "Infographic", "tags": [], "derived_tags": ["ranking-chart", "cities", "data-visualization"], "description": "Visual Capitalist's 'World's Best and Worst Cities for Value' (by Valerii Emelianov): a quadrant scatter plot of cost-of-living vs. quality-of-life percentiles. The tinted quadrants are labeled Best Value / Premium Life / Budget Living / Bad Value, and the dots are colored by region. A reference for quadrant labeling and making a scatter plot readable at a glance.", "text": "Ranked: 100 Global Cities by Quality of Life and Cost 🌆 \n\nThis graphic by Valerii Emelianov is one of the many incre
